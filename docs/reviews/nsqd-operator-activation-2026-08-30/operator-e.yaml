required_before_review:
- bind a component and co-occurrence snapshot by policy and track
- measure atypicality and nearest prior combinations
- complete bounded broader prior-art review beyond the approved five-paper corpus
- require a provenance-bound mechanistic bridge
- compare bridge-valid usefulness and duplication against Operators A and B
- obtain a separate human evidence-sufficiency decision and separate human activation
  after evidence review
forbidden_inferences:
- low co-occurrence is a useful combination
- novelty tau is Operator E evidence
- executable tau authorizes Operator E
- inventory membership authorizes combination generation
- scores or thresholds from one component-scope track transfer to the other
- completed human usefulness review authorizes Operator E
- descriptive A vs E usefulness scores authorize Operator E
- report-only E candidate artifacts are generated combinations
