paraphrase: >-
  The study forecasts 10-minute closing-bid returns for EUR/USD, USD/JPY, and GBP/USD with
  a Transformer encoder that concatenates multivariate FX and cross-asset technical and
  fundamental inputs with positional encoding and Time2Vec embeddings before self-attention
  and pooled prediction layers. Its comparison against LSTM and ARIMA tests whether richer
  multivariate inputs help the Transformer exploit intraday cross-market linkages better
  than univariate setups.
