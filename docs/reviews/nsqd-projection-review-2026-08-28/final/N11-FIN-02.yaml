paraphrase: >-
  CET separately encodes minute-level price-volume sequences and quarterly earnings
  features, combines the resulting stock-context and earnings-context representations into
  a joint context vector, and trains that representation stage with InfoNCE-based
  contrastive predictive coding to maximize agreement with future price-volume latents
  while using negatives drawn from periods at least five days before announcements. A
  supervised head is then fine-tuned to predict next-minute up/down/hold movement during
  the five business days after earnings releases.
