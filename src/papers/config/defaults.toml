[data]
root = "data"
db_path = "data/db/app.sqlite"
blobs_dir = "data/blobs"
blobs_pdf_dir = "data/blobs/pdf"
blobs_md_dir = "data/blobs/md"
blobs_analysis_dir = "data/blobs/analysis"
lancedb_dir = "data/lancedb"

[embeddings]
# Newest Qwen-lineage embedding tag. Replace with qwen3.6-embedding:* when that family ships.
model = "qwen3-embedding:latest"
dimension = 4096
text_slice_strategy = "markdown_full"
base_url = "http://127.0.0.1:11434"

[llm]
default_profile = "default"
default_model = "qwen3.6:35b-a3b-q4_K_M"

[scholar]
api_key = ""  # Optional Semantic Scholar API key (env: SEMANTIC_SCHOLAR_API_KEY)
rate_limit_per_second = 1  # Max requests per second (1/s with basic API key)
require_open_access = true  # Only search for papers with open access PDFs (ArXiv, etc.)

[ui]
search_max_results = 10

[pdf]
unpaywall_email = ""  # Email for Unpaywall API (env: UNPAYWALL_EMAIL)
download_rate_limit_per_second = 2.0  # Max download requests per second
download_max_retries = 3  # Max download retry attempts
download_timeout_s = 120.0  # Download timeout in seconds
