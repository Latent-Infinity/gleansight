source_abstract_sha256: 1b96d6834629f1b2eb72213169b2758667f931d63c1f3d963840ae6b440a350d
paraphrase: >-
  The paper presents a sequential quadratic optimization algorithm for smooth nonlinear
  equality-constrained problems with an objective expressed as the expectation of a
  stochastic function. Each search direction is the sum of a normal step for linearized
  feasibility and a tangential step for objective reduction within the null space of the
  constraint Jacobian. At the abstract level, the method is described as permitting
  stochastic objective gradient estimates. The abstract also claims convergence guarantees
  when constraint Jacobians may be rank deficient. The reported numerical experiments are
  said to show better performance than popular alternatives.
