                - paragraph [ref=f9e183]: "This paper received mixed reviews. The two negative reviews are either low-confidence or rest largely on misreadings of the submission. The two weak-accept reviews were more informative: they raised substantive concerns about volatility confounds, missing econometric baselines, and the absence of domain-specific adaptation, and the rebuttal exchange, and the subsequent rebuttal from the authors meaningfully clarified how the contribution should be framed (e.g., complementary to, rather than superior over, existing econometric tools). Both reviewers were satisfied by this reframing, though neither expressed enthusiasm. The paper also suffers from significant presentation issues flagged by all reviewers, which should be fixed in revision. With the revised framing and the committed presentation fixes incorporated, the paper could sit above the accept threshold."
