                - strong [ref=f9e863]: "Summary:"
                - paragraph [ref=f9e865]: This paper proposes a self-supervised learning framework based on JEPA, which treats daily equity cross-sections as unordered sets and compresses them into fixed factor tokens. By performing masked prediction within a latent space, the model filters out high-noise, hard-to-predict directional price or return information while precisely extracting persistent risk geometry features, providing a high-purity continuous state representation for identifying market regime evolution and predicting systemic recovery.
              - generic [ref=f9e866]:
