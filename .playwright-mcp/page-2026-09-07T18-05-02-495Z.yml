                    - paragraph [ref=f9e768]: As a standalone signal, JEPA displacement is competitive with the strongest stress indicators. When added to the full traditional risk bundle, the held-out gains are small and the bootstrap CIs cover zero. Thus, we interpret displacement as a useful label-free stress summary, rather than as a clearly independent signal beyond that bundle.
