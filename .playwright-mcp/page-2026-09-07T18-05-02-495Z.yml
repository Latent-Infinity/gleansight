                  - paragraph [ref=f9e869]: "Strengths: 1 Using Joint-Embedding Predictive Learning to study stock market dynamics is a novel and interesting perspective."
                  - paragraph [ref=f9e870]: 2 The paper does not focus on predicting returns or prices, but instead concentrates on the overall shape and geometric characteristics of the market. This has meaningful implications for modeling financial markets with low signal-to-noise ratios.
