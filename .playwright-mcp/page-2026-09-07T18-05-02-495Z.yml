                    - heading [level=3] [ref=f9e460]:
                      - strong [ref=f9e461]: Domain adaptation and why the JEPA objective fits
                    - paragraph [ref=f9e462]: "We truly appreciate this point. First, daily equity cross-sections mix persistent structure (volatility clustering, correlation regimes, concentration) with unpredictable noise (idiosyncratic returns, direction). This mix is the fundamental reason that latent prediction fit: compression, dropping what is not predictable across time gaps, rather than forcing reconstruction of every masked variable including the noisy ones."
                    - paragraph [ref=f9e463]: Regarding the transfer from vision not being automatic--we agree. While the foundational building blocks originate in vision, there are key differences that must be, and are, accounted for.
                    - list [ref=f9e464]:
                      - listitem [ref=f9e465]: There is no spatial grid or strict locality, so the tokenizer must be permutation-invariant.
                      - listitem [ref=f9e466]: The universe changes daily as stocks list, delist, or cross liquidity thresholds; validity masks avoid survivorship bias by attending only to stocks actually present.
                      - listitem [ref=f9e467]: Returns are heavy-tailed and non-stationary, so normalization is train-only over time and robust within each day (median/MAD).
                      - listitem [ref=f9e468]: Temporal autocorrelation means naive masking leaks, so structured masking forces prediction across real time separation.
                    - paragraph [ref=f9e469]: Together these address the specific properties the review raises, non-stationarity, heavy tails, and serial autocorrelation, by forcing the model to learn structure that persists across temporal gaps rather than exploiting shortcuts available in gridded, stationary data.
                    - paragraph [ref=f9e470]: "We additionally provide the JEPA/MAE ablation as empirical support. Architecture, tokenizer, masking, and data are held fixed. JEPA outperforms MAE in this domain, with the largest gains on PC1 share and effective rank. Both models are weak in direction. That is the expected signature: if latent prediction is filtering noise, reconstruction must allocate capacity across all masked variables including noisier directional components, while latent prediction can discard them."
