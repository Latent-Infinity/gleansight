                    - heading [level=3] [ref=f9e487]:
                      - strong [ref=f9e488]: On Factor tokens
                    - paragraph [ref=f9e489]: We analyzed PMA slot behavior using (i) attention enrichment over volatility, momentum, and liquidity/size proxies, (ii) per-slot probes, and (iii) regime-conditioned activation statistics.
                    - paragraph [ref=f9e490]: The submitted model exhibits consistent but distributed specialization, individual slots show statistically significant biases (e.g., toward high-volatility or low-momentum equities), and slot activations vary across regimes (e.g., elevated activity during high-volatility/high-concentration periods). However, this structure is shared across multiple slots rather than forming discrete one-slot/one-factor mappings. To test whether sharper specialization is possible, we conducted a controlled PMA follow-up with explicit slot-specific pressure (same tokenizer architecture). In that setting, certain slots (e.g., slot_23, slot_4) interestingly show stronger concentration on high-volatility (+0.323, +0.303) and low-momentum (+0.294, +0.271) equities. With our analysis, we concluded that the slots capture factor-relevant structure in a more distributed form than clean/discrete one-slot/one-factor semantics.
