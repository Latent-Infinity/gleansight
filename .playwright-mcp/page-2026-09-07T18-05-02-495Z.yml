                  - strong [ref=f9e951]: "Rebuttal:"
                  - generic [ref=f9e952]:
                    - heading [level=3] [ref=f9e953]:
                      - strong [ref=f9e954]: Does not provide predictive comparisons with subsequent portfolio performance or overall market movements to demonstrate the accuracy and advantages of its predictions.
                    - paragraph [ref=f9e955]:
                      - text: "We respectfully remind the reviewer that this is not a return-prediction or portfolio-optimization paper, and such comparisons are out of scope. The paper addresses this explicitly in various places: Section 1 (\""
                      - strong [ref=f9e956]: This is a representation learning study
                      - text: ". We do not optimize for expected returns or claim implementable trading strategies\") and the Impact Statement (\"we make no claims that the embeddings are suitable for trading, price prediction, return forecasting, market timing, or alpha generation\"). We also report that the representation drops directional information: kNN retrieval shows weak association with market returns and breadth. That is an intended property of the JEPA objective, since the goal is persistent risk geometry. The paper does not claim to predict market movements, and the evaluations are deliberately designed to characterize the structural content of the learned representation, not to test trading performance."
                    - heading [level=3] [ref=f9e957]:
                      - strong [ref=f9e958]: The matching between abnormal fluctuations of variables in the latent space and news events is somewhat far-fetched and overly subjective.
                    - paragraph [ref=f9e959]: "We agree that the top-3 displacement examples and the cluster-level news labels are illustrative and somewhat subjective; they are meant only to give intuition for the latent space, not to serve as the main evidence. The quantitative claims instead rest on formal tests: the displacement enrichment analysis in Sec. 3.4 (OR = 32.3, one-sided Fisher p < 10^-4 for stress days) and the retrieval metric Δ(W) with shuffled nulls and bootstrap CIs."
                    - heading [level=3] [ref=f9e960]:
                      - strong [ref=f9e961]: It is suggested to discuss the relationship between the proposed conceptual method and anomaly detection in stock market dynamics.
                    - paragraph [ref=f9e962]:
                      - text: We thank the reviewer for this suggestion. Section 3.4 is closely related to anomaly detection, though more precisely the displacement metric
                      - code [ref=f9e963]: "delta_t = ||z_t - z_{t-1}||_2"
                      - text: acts as an unsupervised change-point score in learned state space. It is strongly enriched on realized stress days (OR = 32.3), however, not on scheduled announcements (OR = 1.3; one-sided Fisher p = 0.47), consistent with retrospective anomaly detection rather than event forecasting. In rebuttal we further benchmarked it against standard risk signals and found it is competitive with the best individual signals on stress enrichment (see our response to u7Yx).
                    - heading [level=3] [ref=f9e964]:
                      - strong [ref=f9e965]: Paper presentation / introduction of the baseline methods is unclear
                    - paragraph [ref=f9e966]: "We appreciate the reviewer raising this and recognize this as a real concern. The paper uses different baseline families per evaluation, which may have created the impression that baselines were missing when each section has its own controlled comparison (time/volatility/spectrum for geometry alignment; HAR and handcrafted descriptors for transition prediction; shuffled/seasonality/risk-summary controls for news retrieval; JEPA vs MAE and masking ablations for training). We agree that consolidating definitions would help. For reference:"
                    - list [ref=f9e967]:
                      - listitem [ref=f9e968]:
