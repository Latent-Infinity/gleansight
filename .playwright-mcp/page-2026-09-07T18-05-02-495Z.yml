                - generic [ref=f9e356]:
                  - strong [ref=f9e357]: "Comment:"
                  - generic [ref=f9e358]:
                    - paragraph [ref=f9e359]: Thank you for clarifying. We agree that the presentation can be improved for accessibility to a broader ML audience.
                    - paragraph [ref=f9e360]: "At the same time, we view this primarily as an issue of exposition rather than with contribution. The current submission currently makes the ML setup explicit: Section 1 defines the problem as learning a day-level representation from unordered equity cross-sections using a JEPA objective, and explicitly scopes the work as representation learning. Section 3.3 then defines the specific geometry metrics used in evaluation (corr mean, PC1 share, effective rank)."
                    - paragraph [ref=f9e361]: Some of the additional details asked for are also present in the submission, but deferred to the appendix. Table 7 provides the full per-equity feature definitions (28 features spanning returns, volatility, volume, and market-relative quantities), and Appendix B.1 defines the Set Transformer components used in Eq. 1.
                    - paragraph [ref=f9e362]: We agree, however, surfacing a brief high-level summary of these feature groups and key financial qualities in the main body would improve accessibility for readers without a finance background.
                    - paragraph [ref=f9e363]: In revision, we would address this directly by adding short inline definitions of SAB/ISAB/PMA and a brief main-text summary of the feature groups and financial terms, while keeping fuller implementation details in the appendix. We hope this clarifies the remaining concern and how it can be addressed through improved exposition.
