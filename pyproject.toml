[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gleansight"
version = "0.1.0"
description = "Local-first NS/QD-inspired discovery platform with an executable paper evidence pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
  "pydantic>=2.10",
  "xxhash>=3.4",
  "piccolo[sqlite]>=1.6",
  "jsonschema>=4.21",
  "typer>=0.12",
  "rich>=13.7",
  "flet>=0.80,<0.81",
  "pyyaml>=6.0",
]

[project.scripts]
papers = "papers.cli.app:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers --cov=src --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: marks tests which exercise real dependencies (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
fix = false
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/papers/ui/*"]

[tool.coverage.report]
fail_under = 91.90
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.14.0",
  "ty>=0.0.14",
  "pytest-asyncio>=0.24",
]
infra = [
  "lancedb>=0.14.0",
  "docling>=2.0.0",
  "sentence-transformers>=3.0.0",
  "httpx>=0.27.0",
]

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]
extra-paths = ["."]

[tool.ty.src]
include = ["src", "tests"]
# Flet 0.80 generated control types are not usable with ty (Event[T] invariance,
# BasePage vs Page). Same envelope as coverage omit of src/papers/ui/*.
exclude = ["data", "src/papers/ui", "tests/ui"]

# Test doubles implement the methods a test needs, not every Protocol member.
# Production src remains fully checked.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unused-ignore-comment = "ignore"
