[build-system]
requires = ["setuptools>=84.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gleansight"
version = "0.1.0"
description = "Local-first NS/QD-inspired discovery platform with an executable paper evidence pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"

dependencies = [
  "pydantic>=2.13.5",
  "xxhash>=4.0.1",
  "piccolo[sqlite]>=1.36.0",
  "jsonschema>=4.26.0",
  "typer>=0.26.8",
  "rich>=15.0.0",
  "flet[desktop,web]>=1.0.3,<2",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",
  "mcp==2.3.0",
]

[project.scripts]
papers = "papers.cli.app:app"
gleansight = "gleansight.cli:app"
gleansight-mcp = "gleansight.mcp.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"papers.config" = ["defaults.toml"]

[tool.pytest.ini_options]
minversion = "9.1"
addopts = "--strict-markers --cov=src --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: marks tests which exercise real dependencies (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
fix = false
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/papers/ui/*"]

[tool.coverage.report]
fail_under = 91.90
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.10",
  "ty>=0.0.84",
  "pytest-asyncio>=1.4.0",
]
infra = [
  "lancedb>=0.39.0",
  "docling>=2.132.0",
  "sentence-transformers>=6.1.0",
]
research = [
  "torch>=2.14.1,<3",
  "numpy>=2.5.3,<3",
]

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]
extra-paths = ["."]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["data"]

[tool.pyright]
extraPaths = ["src"]

[tool.uv]
required-version = "==0.12.18"
