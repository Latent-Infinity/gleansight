paraphrase: >-
  Fin-JEPA maps 22 daily price-and-volume features into 64-dimensional latents with a
  three-layer MLP, then uses a causally masked Transformer to predict a 10-step future
  latent window from a 30-step context while SIGReg regularizes the embedding distribution
  against collapse. Its latent predictions improve on an identity baseline, but a separate
  evaluation finds that prediction error does not reliably discriminate forward returns.
