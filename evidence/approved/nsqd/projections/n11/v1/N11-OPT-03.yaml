paraphrase: >-
  DMFW solves constrained stochastic objectives over a network without Euclidean
  projections. Each agent combines consensus and gradient-tracking updates with recursive
  and Nesterov momentum, then solves a Frank-Wolfe linear minimization subproblem over the
  shared convex compact feasible set; fixed-size stochastic batches are allowed.
