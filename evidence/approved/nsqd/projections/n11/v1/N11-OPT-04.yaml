paraphrase: >-
  At each iteration, the stochastic SQO scheme combines a feasibility-oriented component
  based on the local constraint linearization with an objective-improving component
  restricted to directions annihilated by the current Jacobian. Stochastic objective
  derivatives feed the latter component, while adaptive merit and protected step-length
  rules preserve its stated guarantees for deficient-rank Jacobians and infeasible cases.
