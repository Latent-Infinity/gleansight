paraphrase: >-
  EXFormer forecasts day-ahead FX returns by applying parallel convolutional receptive
  fields before self-attention to align local slopes across scales, dynamically weighting
  28 exogenous covariates, and recalibrating channels with squeeze-and-excitation before a
  GRU decoder. The design targets return dynamics driven jointly by short-term noise and
  slower cross-market factors.
