paraphrase: >-
  Choco-SGD alternates local stochastic-gradient steps with compressed gossip updates over
  a fixed neighbor graph. Each node keeps an auxiliary state tracking the compressed
  information already shared with its neighbors, allowing biased or unbiased compression
  while recovering centralized mini-batch SGD's leading convergence term.
