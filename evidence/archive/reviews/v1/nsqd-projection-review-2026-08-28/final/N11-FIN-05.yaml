paraphrase: >-
  The pretext stage feeds a denoising autoencoder a corrupted input formed by repeating the
  raw price series across channels and trains it to reconstruct a smoother moving-average
  feature matrix. Up/stationary/down labels are then recomputed from the reconstructed price
  series and evaluated with a downstream SVM and binary trading strategies on daily S&P
  500, one-minute Bitcoin, and limit-order datasets.
