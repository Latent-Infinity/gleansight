title: Replication candidate for DATA-NSQD-03, variant 1
one_sentence_claim: 'A direct replication candidate restates the finding as follows:
  For mechanism=flow-driven|target=drawdown|horizon=intraday, negative aggregate ex-ante
  dealer gamma imbalance, especially under illiquidity, is associated with intraday
  momentum. In flash-crash episodes, negative gamma states are associated with deeper
  drawdowns. The paper discusses dealer delta-hedging/order-flow feedback as a possible
  mechanism, without supporting a causal claim.'
mechanism: Re-evaluate the mechanism reported by approved projection DATA-NSQD-03.
differential_prediction: The reproduced test should preserve the approved claim's
  direction and scope.
cheapest_falsifier: Repeat the source paper's reported comparison on an independent
  held-out sample.
kill_criteria: Reject the replication candidate if the reported relationship does
  not reproduce.
research_descriptor:
  mechanism: flow-driven
  target: drawdown
  horizon: intraday
paraphrase: 'A direct replication candidate restates the finding as follows: For mechanism=flow-driven|target=drawdown|horizon=intraday,
  negative aggregate ex-ante dealer gamma imbalance, especially under illiquidity,
  is associated with intraday momentum. In flash-crash episodes, negative gamma states
