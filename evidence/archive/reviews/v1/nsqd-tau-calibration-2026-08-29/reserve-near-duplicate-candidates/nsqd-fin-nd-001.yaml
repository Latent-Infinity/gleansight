schema_version: 1
kind: candidate-requirement-card
id: nsqd-fin-nd-001
domain_policy_id: finance/1
title: Replication candidate for N11-FIN-01, variant 1
one_sentence_claim: 'A direct replication candidate restates the finding as follows:
  Fin-JEPA maps 22 daily price-and-volume features into 64-dimensional latents with
  a three-layer MLP, then uses a causally masked Transformer to predict a 10-step
  future latent window from a 30-step context while SIGReg regularizes the embedding
  distribution against collapse. Its latent predictions improve on an identity baseline,
  but a separate evaluation finds that prediction error does not reliably discriminate
  forward returns.'
mechanism: Re-evaluate the mechanism reported by approved projection N11-FIN-01.
differential_prediction: The reproduced test should preserve the approved claim's
  direction and scope.
cheapest_falsifier: Repeat the source paper's reported comparison on an independent
  held-out sample.
kill_criteria: Reject the replication candidate if the reported relationship does
  not reproduce.
research_descriptor:
  mechanism: institutional
  target: returns
  horizon: daily
